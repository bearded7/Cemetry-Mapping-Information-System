<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><%= title %></title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
  <link rel="stylesheet" href="/public/css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <%- include('partials/header') %>

  <div class="container-fluid p-0">
    <div class="row g-0">
      <!-- Sidebar -->
      <div class="col-lg-3 col-md-4 sidebar">
        <div class="sidebar-content p-3">
          <h4><i class="fas fa-search me-2"></i>Search Graves</h4>
          <form id="search-form" class="mb-4">
            <div class="mb-3">
              <input type="text" class="form-control" id="search-name" 
                     placeholder="Search by name..." aria-label="Search by name">
            </div>
            <div class="mb-3">
              <select class="form-select" id="search-cemetery">
                <option value="">All Cemeteries</option>
                <!-- Dynamically populated -->
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-search me-2"></i>Search
            </button>
          </form>

          <h5><i class="fas fa-list me-2"></i>Results</h5>
          <div id="search-results" class="search-results">
            <p class="text-muted">Click on the map or search to see results.</p>
          </div>

          <hr>

          <div class="legend">
            <h6><i class="fas fa-info-circle me-2"></i>Legend</h6>
            <div class="d-flex align-items-center mb-2">
              <span class="legend-marker cemetery-marker me-2"></span>
              <span>Cemetery</span>
            </div>
            <div class="d-flex align-items-center mb-2">
              <span class="legend-marker grave-marker me-2"></span>
              <span>Grave</span>
            </div>
          </div>

          <% if (isAuthenticated) { %>
            <hr>
            <div class="text-center">
              <a href="/graves/new" class="btn btn-success w-100">
                <i class="fas fa-plus me-2"></i>Add New Grave
              </a>
              <small class="text-muted d-block mt-1">GPS coordinates required</small>
            </div>
          <% } %>
        </div>
      </div>

      <!-- Map Container -->
      <div class="col-lg-9 col-md-8">
        <div id="map"></div>
      </div>
    </div>
  </div>

  <!-- Grave Info Modal -->
  <div class="modal fade" id="graveModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Grave Information</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="grave-info-content">
          <!-- Dynamically populated -->
        </div>
      </div>
    </div>
  </div>

  <%- include('partials/footer') %>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/js/map.js"></script>
</body>
</html>
