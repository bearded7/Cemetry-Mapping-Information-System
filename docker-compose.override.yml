# ============================================================
# Development Overrides - Use with: docker-compose -f docker-compose.yml -f docker-compose.override.yml up
# ============================================================

version: '3.8'

services:
  app:
    environment:
      - NODE_ENV=development
      - DEBUG=*
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  db:
    ports:
      - "5432:5432"