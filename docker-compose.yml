version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://admin:password@db:5432/cemetery
      - SESSION_SECRET=dev-secret-change-me
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    networks:
      - cemetery-network

  db:
    image: postgis/postgis:15-3.4
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=cemetery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - cemetery-network

volumes:
  postgres-data:

networks:
  cemetery-network:
    driver: bridge