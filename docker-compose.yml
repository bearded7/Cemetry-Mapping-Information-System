services:
  app:
    build: .
    image: cemetery-registry:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - cemetery_data:/app/data
      - cemetery_uploads_graves:/app/uploads/graves
      - cemetery_uploads_messages:/app/uploads/messages
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cemetery_data:
  cemetery_uploads_graves:
  cemetery_uploads_messages:
