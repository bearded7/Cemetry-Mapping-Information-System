# ============================================================
# Render Deployment Configuration
# Choose ONE of the following deployment methods
# ============================================================

# METHOD 1: Node.js Runtime (Recommended for simplicity)
services:
  - type: web
    name: cemetery-mapping-system
    env: node
    plan: free
    buildCommand: |
      npm install --production=false
      npm run migrate || true
      npm run seed || true
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cemetery-db
          property: connectionString
      - key: ADMIN_EMAIL
        value: admin@cemetery.com
      - key: ADMIN_PASSWORD
        value: admin123
    healthCheckPath: /health
    autoDeploy: true

  # PostgreSQL Database
  - type: postgresql
    name: cemetery-db
    plan: free
    ipAllowList: []
    postgresMajorVersion: 15
    databaseName: cemetery_db
    user: postgres

