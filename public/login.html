<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Greenwood Registry</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3C10 3 6 8 6 13.5C6 20 16 29 16 29C16 29 26 20 26 13.5C26 8 22 3 16 3Z" stroke="#3F5D48" stroke-width="1.8"/><path d="M12 16V10C12 8.3 13.3 7 15 7H17C18.7 7 20 8.3 20 10V16" stroke="#A9814B" stroke-width="1.6"/><path d="M11 16H21" stroke="#A9814B" stroke-width="1.6"/></svg>
      Greenwood Registry
    </a>
    <div class="nav-actions" id="navActions"></div>
  </nav>
</header>

<main class="narrow">
  <div class="form-card">
    <h1 style="margin-bottom:6px;">Welcome back</h1>
    <p class="muted" style="margin-bottom:24px;">Log in to add a grave or check your submissions.</p>
    <div id="formAlert"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Log in</button>
    </form>
    <p class="muted" style="margin-top:18px; text-align:center;">No account yet? <a href="/register.html">Register</a></p>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const alertBox = document.getElementById('formAlert');
  alertBox.innerHTML = '';
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Logging in…';
  try {
    await Api.post('/api/auth/login', {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });
    const params = new URLSearchParams(window.location.search);
    window.location.href = params.get('next') || '/';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false;
    btn.textContent = 'Log in';
  }
});
</script>
</body>
</html>
