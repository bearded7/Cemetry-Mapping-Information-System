<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grave record — Greenwood Registry</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <nav class="nav">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3C10 3 6 8 6 13.5C6 20 16 29 16 29C16 29 26 20 26 13.5C26 8 22 3 16 3Z" stroke="#3F5D48" stroke-width="1.8"/><path d="M12 16V10C12 8.3 13.3 7 15 7H17C18.7 7 20 8.3 20 10V16" stroke="#A9814B" stroke-width="1.6"/><path d="M11 16H21" stroke="#A9814B" stroke-width="1.6"/></svg>
      Greenwood Registry
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="/map.html">Map &amp; directions</a></li>
      <li><a href="/search.html">Search records</a></li>
      <li><a href="/submit-grave.html">Add a grave</a></li>
    </ul>
    <div class="nav-actions" id="navActions"></div>
  </nav>
</header>

<main id="main" class="container section" id="graveDetail">
  <p class="muted">Loading record…</p>
</main>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script>
(function () {
  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }
  const id = new URLSearchParams(window.location.search).get('id');
  const el = document.getElementById('graveDetail');
  if (!id) { el.innerHTML = '<div class="alert alert-error">No grave specified.</div>'; return; }

  Api.get(`/api/graves/${id}`).then(({ grave }) => {
    const b = grave.date_of_birth ? grave.date_of_birth.slice(0, 10) : 'Unknown';
    const d = grave.date_of_death ? grave.date_of_death.slice(0, 10) : 'Unknown';
    el.innerHTML = `
      <div class="page-header" style="border:none; padding-top:0;">
        <h1>${escapeHtml(grave.first_name)} ${escapeHtml(grave.last_name)}${grave.maiden_name ? ` <span class="muted" style="font-size:1.2rem;">(née ${escapeHtml(grave.maiden_name)})</span>` : ''}</h1>
        ${grave.epitaph ? `<p class="muted" style="font-style:italic;">“${escapeHtml(grave.epitaph)}”</p>` : ''}
      </div>
      <div class="grid-2" style="margin-top:24px; align-items:start;">
        <div>
          <div class="card" style="margin-bottom:16px;">
            <h3>Details</h3>
            <p><strong>Born:</strong> ${escapeHtml(b)}</p>
            <p><strong>Died:</strong> ${escapeHtml(d)}</p>
            ${grave.plot_reference ? `<p><strong>Plot:</strong> <span class="mono">${escapeHtml(grave.plot_reference)}</span></p>` : ''}
            <p class="mono muted" style="font-size:0.85rem;">${grave.latitude.toFixed(5)}°, ${grave.longitude.toFixed(5)}°</p>
            <a class="btn btn-primary" href="/map.html?graveId=${grave.id}">Get directions</a>
          </div>
          ${grave.biography ? `<div class="card"><h3>Biography</h3><p>${escapeHtml(grave.biography)}</p></div>` : ''}
        </div>
        <div>
          ${grave.photos.length ? `
            <div class="grid-2">
              ${grave.photos.map((p) => `<img src="${p.url}" alt="${escapeHtml(p.caption || 'Headstone photo')}" style="border-radius:12px; border:1px solid var(--border);">`).join('')}
            </div>` : `<div class="empty-state"><p>No photos have been added for this record yet.</p></div>`}
        </div>
      </div>
    `;
  }).catch((err) => {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  });
})();
</script>
</body>
</html>
