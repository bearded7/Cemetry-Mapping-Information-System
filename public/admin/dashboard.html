<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin review — Greenwood Registry</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  .chat-log { max-height: 50vh; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); background: var(--surface-sunken); border-radius: var(--radius-md); }
  .msg-bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: 0.92rem; line-height: 1.45; }
  .msg-user { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); }
  .msg-admin { align-self: flex-end; background: var(--moss-600); color: #fff; }
  .msg-meta { font-size: 0.72rem; opacity: 0.75; margin-top: 4px; }
  .msg-attachments { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .msg-attachments img { max-width: 200px; border-radius: 8px; display: block; }
  .conv-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
  .conv-row:hover, .conv-row.active { background: var(--moss-100); border-color: #c3d5c1; }
  .conv-unread { background: var(--danger-600); color: #fff; font-size: 0.7rem; border-radius: 999px; padding: 1px 7px; }
</style>
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a class="brand" href="/">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3C10 3 6 8 6 13.5C6 20 16 29 16 29C16 29 26 20 26 13.5C26 8 22 3 16 3Z" stroke="#3F5D48" stroke-width="1.8"/><path d="M12 16V10C12 8.3 13.3 7 15 7H17C18.7 7 20 8.3 20 10V16" stroke="#A9814B" stroke-width="1.6"/><path d="M11 16H21" stroke="#A9814B" stroke-width="1.6"/></svg>
      Greenwood Registry
    </a>
    <div class="nav-actions" id="navActions"></div>
  </nav>
</header>

<main class="container section">
  <div class="page-header" style="border:none; padding-top:0;">
    <h1>Admin review</h1>
    <p class="muted">Approve or reject submissions, and reply to visitor messages.</p>
  </div>

  <div class="stat-row" id="statRow"></div>

  <div class="tabs">
    <button class="tab active" data-tab="pending">Pending review</button>
    <button class="tab" data-tab="approved">Approved</button>
    <button class="tab" data-tab="rejected">Rejected</button>
    <button class="tab" data-tab="messages">Messages <span id="convUnreadBadge" hidden class="conv-unread"></span></button>
  </div>

  <div id="reviewPane"></div>

  <div id="messagesPane" hidden>
    <div class="grid-2" style="align-items:start;">
      <div class="card" style="max-height:70vh; overflow-y:auto; padding:8px;">
        <h3 style="padding:0 8px;">Conversations</h3>
        <div id="convList"></div>
      </div>
      <div class="card" id="convDetail">
        <p class="muted">Select a conversation to view messages.</p>
      </div>
    </div>
  </div>
</main>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/chatRender.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
